services:
  activitywatch:
    image: ${AW_IMAGE:?Set AW_IMAGE to the digest-pinned image reference from example.env}
    container_name: activitywatch
    restart: unless-stopped
    read_only: true
    init: true
    user: "${AW_UID:-1000}:${AW_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      # Pinned third-party image: update the digest in Portainer deliberately.
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      # Bind ONLY to the Services Tailscale IP. Never 0.0.0.0 (the API has no auth).
      - "${AW_BIND_ADDRESS:?Set to the Services Tailscale IP}:${AW_PORT:-5600}:5600"
    volumes:
      - ${AW_DATA_DIR:?Set AW_DATA_DIR to a dedicated host data directory}:/config
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      # No HOME for an arbitrary UID; keep the cache on the data volume.
      XDG_CACHE_HOME: /config/cache
    # Listen on all container interfaces (host exposure is limited by the port binding above).
    command:
      - /app/activitywatch/aw-server/aw-server
      - --host
      - 0.0.0.0
      - --cors-origins
      - http://${AW_BIND_ADDRESS}:${AW_PORT:-5600}
    healthcheck:
      # The image has no wget/curl; probe with bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/5600 && printf 'GET /api/0/info HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

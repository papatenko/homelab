services:
  server:
    image: ghcr.io/patchmon/patchmon-server:2.1.8
    hostname: patchmon-server
    restart: unless-stopped
    environment:
      PORT: "3000"
      TRUST_PROXY: "true"
      TRUSTED_PROXY_RANGES: ${TRUSTED_PROXY_RANGES:?set proxy network}
      CORS_ORIGIN: ${CORS_ORIGIN:?set HTTPS origin}
      JWT_SECRET: ${JWT_SECRET:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?required}
      POSTGRES_HOST: database
      POSTGRES_USER: patchmon
      POSTGRES_DB: patchmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_URL: postgresql://patchmon:${POSTGRES_PASSWORD:?required}@database:5432/patchmon
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      TZ: America/Chicago
    networks:
      - default
      - proxy
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchmon
      POSTGRES_DB: patchmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchmon -d patchmon"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      com.centurylinklabs.watchtower.enable: "false"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set existing proxy network}
volumes:
  postgres_data:
  redis_data:

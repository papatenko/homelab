services:
  faster-whisper-turbo:
    image: ${FASTER_WHISPER_IMAGE:-hwdsl2/whisper-server:latest}
    container_name: ${FASTER_WHISPER_CONTAINER_NAME:-faster-whisper-turbo}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_LOG_LEVEL: ${WHISPER_LOG_LEVEL:-INFO}
      WHISPER_DISABLE_USAGE_COUNTS: ${WHISPER_DISABLE_USAGE_COUNTS:-1}
    ports:
      - "${FASTER_WHISPER_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_PORT_HTTP:-18881}:9000/tcp"
    volumes:
      - ${DATA_DIR:-/opt/stacks/faster-whisper-turbo}/data:/var/lib/whisper
    cpus: ${FASTER_WHISPER_CPU_LIMIT:-2.0}
    mem_limit: ${FASTER_WHISPER_MEMORY_LIMIT:-4g}
    pids_limit: ${FASTER_WHISPER_PIDS_LIMIT:-256}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5));
          assert data.get('status') == 'ok'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

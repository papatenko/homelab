services:
  coolify:
    image: "${COOLIFY_IMAGE:-ghcr.io/coollabsio/coolify:v4.3.0}"
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/source/.env"
        target: /var/www/html/.env
        read_only: true
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/ssh:/var/www/html/storage/app/ssh"
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/applications:/var/www/html/storage/app/applications"
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/databases:/var/www/html/storage/app/databases"
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/services:/var/www/html/storage/app/services"
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/backups:/var/www/html/storage/app/backups"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-256M}"
      PHP_FPM_PM_CONTROL: "${PHP_FPM_PM_CONTROL:-dynamic}"
      PHP_FPM_PM_START_SERVERS: "${PHP_FPM_PM_START_SERVERS:-1}"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}"
    ports:
      - "${COOLIFY_APP_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

  postgres:
    image: "${COOLIFY_POSTGRES_IMAGE:-postgres:15-alpine}"
    container_name: coolify-db
    restart: always
    networks:
      - coolify
    volumes:
      - coolify-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      timeout: 2s

  redis:
    image: "${COOLIFY_REDIS_IMAGE:-redis:7-alpine}"
    container_name: coolify-redis
    restart: always
    networks:
      - coolify
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      retries: 10
      timeout: 2s

  realtime:
    image: "${COOLIFY_REALTIME_IMAGE:-ghcr.io/coollabsio/coolify-realtime:1.0.17}"
    container_name: coolify-realtime
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify
    ports:
      - "${COOLIFY_REALTIME_PORT:-6001}:6001"
      - "${COOLIFY_REALTIME_SECURE_PORT:-6002}:6002"
    volumes:
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/ssh:/var/www/html/storage/app/ssh"
    environment:
      APP_NAME: "${APP_NAME:-Coolify}"
      SOKETI_DEBUG: "${SOKETI_DEBUG:-false}"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:?Set PUSHER_APP_ID}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:?Set PUSHER_APP_KEY}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:?Set PUSHER_APP_SECRET}"
      SOKETI_HOST: "${SOKETI_HOST:-0.0.0.0}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

  proxy:
    image: "${COOLIFY_PROXY_IMAGE:-traefik:v3.7.10}"
    container_name: coolify-proxy
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify
    ports:
      - "${COOLIFY_HTTP_PORT:-80}:80"
      - "${COOLIFY_HTTPS_PORT:-443}:443"
      - "${COOLIFY_HTTPS_PORT:-443}:443/udp"
      - "${COOLIFY_PROXY_API_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/proxy:/traefik"
    command:
      - --ping=true
      - --ping.entrypoint=http
      - --api.dashboard=true
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --entrypoints.http.http.encodequerysemicolons=true
      - --entryPoints.http.http2.maxConcurrentStreams=250
      - --entrypoints.https.http.encodequerysemicolons=true
      - --entryPoints.https.http2.maxConcurrentStreams=250
      - --entrypoints.https.http3
      - --providers.file.directory=/traefik/dynamic/
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http
      - --certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.entrypoints: http
      traefik.http.routers.traefik.service: api@internal
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      coolify.managed: "true"
      coolify.proxy: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ping || exit 1"]
      interval: 4s
      timeout: 2s
      retries: 5

  sentinel:
    image: "${COOLIFY_SENTINEL_IMAGE:-ghcr.io/coollabsio/sentinel:0.0.22}"
    container_name: coolify-sentinel
    restart: "no"
    command: ["/app/sentinel"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${COOLIFY_DATA_DIR:?Set COOLIFY_DATA_DIR}/sentinel:/app/db"
    environment:
      TOKEN: "${COOLIFY_SENTINEL_TOKEN:?Set COOLIFY_SENTINEL_TOKEN}"

volumes:
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis

networks:
  coolify:
    name: coolify
    driver: bridge
    external: true

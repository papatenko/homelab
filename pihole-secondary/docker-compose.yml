services:
  pihole-secondary:
    container_name: pihole-secondary
    image: pihole/pihole:${PIHOLE_TAG:-latest}
    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI / API (HTTPS, self-signed). Host port is configurable because
      # 80/443 are commonly taken by a reverse proxy on the same host.
      - "${PIHOLE_WEB_PORT:-8453}:443/tcp"
    environment:
      TZ: ${TZ:-America/Chicago}
      FTLCONF_webserver_api_password: ${API_PASSWORD}
      FTLCONF_dns_listeningMode: 'all'
      # Independent public upstreams so this resolver never depends on the primary.
      FTLCONF_dns_upstreams: ${DNS_UPSTREAMS:-1.1.1.1;8.8.8.8}
    volumes:
      - ${DATA_DIR:-/opt/stacks/pihole-secondary}/etc-pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  nebula-sync:
    container_name: nebula-sync
    image: ghcr.io/lovelaze/nebula-sync:${NEBULA_SYNC_TAG:-latest}
    depends_on:
      pihole-secondary:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Chicago}
      # One-way: primary -> secondary. Format is "<url>|<password>".
      PRIMARY: ${PRIMARY_URL}|${PRIMARY_PASSWORD}
      REPLICAS: https://pihole-secondary:443|${API_PASSWORD}
      # Both ends use Pi-hole's self-signed certificate.
      CLIENT_SKIP_TLS_VERIFICATION: "true"
      # Granular sync (not a full Teleporter import) so the replica keeps its
      # own upstreams and listening settings.
      FULL_SYNC: "false"
      SYNC_CONFIG_DNS: "true"
      SYNC_CONFIG_DNS_EXCLUDE: upstreams,interface,listeningMode
      SYNC_GRAVITY_GROUP: "true"
      SYNC_GRAVITY_AD_LIST: "true"
      SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_DOMAIN_LIST: "true"
      SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
      SYNC_GRAVITY_CLIENT: "true"
      SYNC_GRAVITY_CLIENT_BY_GROUP: "true"
      RUN_GRAVITY: "true"
      CRON: ${SYNC_CRON:-0 * * * *}
      # Optional health pings after each run (e.g. an Uptime Kuma push monitor:
      # success URL ...?status=up, failure URL ...?status=down). Empty = off.
      WEBHOOK_SYNC_SUCCESS_URL: ${SYNC_SUCCESS_WEBHOOK_URL:-}
      WEBHOOK_SYNC_SUCCESS_METHOD: GET
      WEBHOOK_SYNC_FAILURE_URL: ${SYNC_FAILURE_WEBHOOK_URL:-}
      WEBHOOK_SYNC_FAILURE_METHOD: GET
    restart: unless-stopped

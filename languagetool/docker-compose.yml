services:
  languagetool:
    image: erikvl87/languagetool:6.8
    container_name: languagetool
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '8010:8010/tcp'
    environment:
      langtool_languageModel: /ngrams
      Java_Xms: ${JAVA_XMS:-512m}
      Java_Xmx: ${JAVA_XMX:-2g}
    volumes:
      - ${DATA_DIR:-/opt/stacks/languagetool}/ngrams:/ngrams

services:
  anki-sync:
    image: ${ANKI_IMAGE:-chrislongros/anki-sync-server-enhanced:latest}
    pull_policy: ${ANKI_PULL_POLICY:-missing}
    labels:
      com.centurylinklabs.watchtower.enable: ${ANKI_WATCHTOWER_ENABLE:-true}
    restart: unless-stopped
    environment:
      SYNC_USER1: ${SYNC_USER1:?Configure via approved secret provisioning}
      PUID: "10001"
      PGID: "10001"
    ports:
      - "${ANKI_BIND_ADDRESS:?Set private bind address}:${ANKI_PORT:?Set available host port}:8080"
    volumes:
      - ${ANKI_DATA_DIR:?Set persistent data directory}:/data

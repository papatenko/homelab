services:
  openviking:
    image: ${OPENVIKING_IMAGE:-ghcr.io/volcengine/openviking:latest}
    container_name: openviking
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -a
        . /run/secrets/openviking-vlm.env
        set +a
        exec openviking-entrypoint
    ports:
      # Set this to the deployment host's private bind address in Portainer.
      # Do not use 0.0.0.0.
      - "${OPENVIKING_BIND_ADDRESS:?Set the private bind address}:${OPENVIKING_SERVER_PORT:-1933}:${OPENVIKING_SERVER_PORT:-1933}"
    environment:
      OPENVIKING_SERVER_PORT: ${OPENVIKING_SERVER_PORT:-1933}
      OPENVIKING_PUBLIC_BASE_URL: "${OPENVIKING_PUBLIC_BASE_URL:?Set the public base URL}"
      OPENVIKING_VLM_MODEL: "${OPENVIKING_VLM_MODEL:-gpt-5.4-mini}"
      OPENVIKING_VLM_PROVIDER: "${OPENVIKING_VLM_PROVIDER:-openai-codex}"
      OPENVIKING_VLM_API_BASE: "${OPENVIKING_VLM_API_BASE:-https://chatgpt.com/backend-api/codex}"
      OPENVIKING_VLM_SESSION_ID: "${OPENVIKING_VLM_SESSION_ID:-openviking-agent-memory}"
      OPENVIKING_AUTH_MODE: "${OPENVIKING_AUTH_MODE:-api_key}"

    volumes:
      # Contains only OpenViking configuration, OAuth state, models, and derived indexes.
      - "${OPENVIKING_DATA_DIR:?Set the OpenViking data path}:/app/.openviking"
      # Root-owned BWS-fed VLM key, mounted read-only from the Docker endpoint.
      - "${OPENVIKING_VLM_SECRETS_FILE:-/run/openviking/vlm.env}:/run/secrets/openviking-vlm.env:ro"
      # Mount the authoritative source directories read-only.
      - "${OPENVIKING_WIKI_PATH:?Set the wiki source path}:/vault/wiki:ro"
      - "${OPENVIKING_MOC_PATH:?Set the MOC source path}:/vault/mocs:ro"
      - "${OPENVIKING_SKILLS_PATH:?Set the skills source path}:/vault/skills:ro"
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Local-only embeddings keep vectorization separate from Codex OAuth, which
  # OpenViking uses for its VLM. No port is published for this container.
  embeddings:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: openviking-embeddings
    restart: unless-stopped
    environment: {}
    volumes:
      - "${OPENVIKING_DATA_DIR:?Set the OpenViking data path}/ollama:/root/.ollama"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

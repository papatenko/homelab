services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${KUMA_BIND_ADDRESS:-127.0.0.1}:${KUMA_PORT:-3001}:3001"
    volumes:
      - ${KUMA_DATA_DIR:-/opt/stacks/uptime-kuma}:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode < 500 ? 0 : 1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

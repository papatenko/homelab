# Native image-build overlay. Do not select this file for Portainer Git stacks.
# On the NAS, build one or both locally tagged images before a Portainer deploy:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build neutts neutts-air
services:
  neutts:
    build:
      context: .
      dockerfile: Dockerfile

  neutts-air:
    build:
      context: .
      dockerfile: air.Dockerfile

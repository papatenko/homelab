services:
  semaphore:
    image: semaphoreui/semaphore:v2.20.23
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: database
      SEMAPHORE_DB_PORT: "5432"
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_NAME: semaphore
      SEMAPHORE_DB_PASS: ${POSTGRES_PASSWORD:?required}
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      SEMAPHORE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${ACCESS_KEY_ENCRYPTION:?required base64 32 bytes}
      SEMAPHORE_WEB_ROOT: ""
      SEMAPHORE_TELEGRAM_ALERT: ${SEMAPHORE_TELEGRAM_ALERT:-false}
      SEMAPHORE_TELEGRAM_CHAT: ${SEMAPHORE_TELEGRAM_CHAT:-}
      SEMAPHORE_TELEGRAM_TOKEN: ${SEMAPHORE_TELEGRAM_TOKEN:-}
      HC_API_KEY_RO: ${HC_API_KEY_RO:-}
      TZ: America/Chicago
    ports:
      - "${SEMAPHORE_BIND_ADDRESS:-127.0.0.1}:${SEMAPHORE_PORT:-3020}:3000"
    volumes:
      - semaphore_data:/etc/semaphore
      - semaphore_tmp:/tmp/semaphore
    depends_on:
      database:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_DB: semaphore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore -d semaphore"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      com.centurylinklabs.watchtower.enable: "false"
volumes:
  semaphore_data:
  semaphore_tmp:
  postgres_data:

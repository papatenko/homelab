services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      TZ: ${TZ:-UTC}
      NTFY_BASE_URL: ${NTFY_BASE_URL:?Set NTFY_BASE_URL to the actual loopback or private LAN/VPN URL matching NTFY_BIND_ADDRESS}
      NTFY_LISTEN_HTTP: 0.0.0.0:80
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/cache/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny
      NTFY_BEHIND_PROXY: "false"
    ports:
      - "${NTFY_BIND_ADDRESS:?Set NTFY_BIND_ADDRESS to loopback or a private LAN/VPN address}:${NTFY_PORT:?Set NTFY_PORT to the approved host port}:80"
    volumes:
      - ${NTFY_DATA_DIR:?Set NTFY_DATA_DIR to an existing local-disk host directory}:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

name: wg-easy

volumes:
  etc_wireguard:
    external: true
    name: wgeasy_etc_wireguard

services:
  wg-easy:
    environment:
      # v15 keeps settings, users and clients in /etc/wireguard/wg-easy.db (setup wizard / admin UI).
      # The UI is LAN-only over plain HTTP, so session cookies must be allowed without TLS.
      - INSECURE=${WG_INSECURE:-true}
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: ${IPV4_ADDRESS}
        ipv6_address: ${IPV6_ADDRESS}::2a
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1


networks:
  wg:
    external: true
    name: ${WG_NETWORK_NAME:-wg-easy_wg}

name: wg-easy

volumes:
  etc_wireguard:
    external: true
    name: wgeasy_etc_wireguard

services:
  wg-easy:
    environment:
      - WG_HOST=${WG_HOST}
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS}
      - WG_DEFAULT_ADDRESS=${WG_DEFAULT_ADDRESS}
      # Required: without it wg-easy v14 serves the admin UI with no login at all.
      # Generate with: docker run --rm ghcr.io/wg-easy/wg-easy:14 wgpw 'YOUR_PASSWORD'
      - PASSWORD_HASH=${PASSWORD_HASH:?Set PASSWORD_HASH (bcrypt from wgpw) before deploying}
    # Pinned: v15 replaced the env-based config with a setup wizard and new schema.
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: ${IPV4_ADDRESS}
        ipv6_address: ${IPV6_ADDRESS}::2a
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1


networks:
  wg:
    external: true
    name: ${WG_NETWORK_NAME:-wg-easy_wg}

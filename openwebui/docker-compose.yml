name: openwebui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    init: true
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_SIGNUP: "false"
      WEBUI_AUTH: "true"
      # The first start may fetch the pinned local embedding model. No source
      # documents are sent to a remote embedding provider.
      # Empty selects Open WebUI built-in SentenceTransformers embeddings.
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      # Optional OIDC single sign-on. Enabled only when the client ID and
      # provider URL are set. Public client with PKCE, so no client secret.
      WEBUI_URL: ${OPEN_WEBUI_PUBLIC_URL:-}
      OAUTH_CLIENT_ID: ${OPEN_WEBUI_OIDC_CLIENT_ID:-}
      OPENID_PROVIDER_URL: ${OPEN_WEBUI_OIDC_PROVIDER_URL:-}
      OPENID_REDIRECT_URI: ${OPEN_WEBUI_PUBLIC_URL:-}/oauth/oidc/callback
      OAUTH_PROVIDER_NAME: ${OPEN_WEBUI_OIDC_PROVIDER_NAME:-SSO}
      OAUTH_CODE_CHALLENGE_METHOD: "S256"
      OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: "none"
      ENABLE_OAUTH_SIGNUP: "false"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      ENABLE_LOGIN_FORM: ${OPEN_WEBUI_ENABLE_LOGIN_FORM:-true}
    volumes:
      - ${OPEN_WEBUI_DATA_DIR:?set OPEN_WEBUI_DATA_DIR in Portainer}:/app/backend/data
    networks:
      - openwebui-internal
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:?set OPEN_WEBUI_BIND_ADDRESS in Portainer}:${OPEN_WEBUI_PORT:-3000}:8080"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "0.50"
          memory: 2G
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  oikb:
    image: ghcr.io/open-webui/oikb:latest
    container_name: oikb
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      OIKB_API_KEY_FILE: /run/secrets/oikb_api_key
      LOG_FORMAT: json
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    secrets:
      - open_webui_rag_sync_api_key
      - oikb_api_key
    volumes:
      - ${OBSIDIAN_PILOT_SOURCE_DIR:?set an approved local pilot directory in Portainer}:/source:ro
      - ${OIKB_CONFIG_PATH:?set a host-side generated config path in Portainer}:/app/.oikb.yaml:ro
    networks:
      - openwebui-internal
    expose:
      - "8080"
    # oikb reads the Open WebUI key only from OPEN_WEBUI_API_KEY (no *_FILE
    # support for this variable), so load it from the secret at startup.
    entrypoint: ["sh", "-c", "OPEN_WEBUI_API_KEY=\"$$(cat /run/secrets/open_webui_rag_sync_api_key)\" exec oikb daemon"]
    depends_on:
      open-webui:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  # This network is not Docker-internal because Open WebUI publishes one
  # explicitly private host binding. External exposure remains controlled by
  # OPEN_WEBUI_BIND_ADDRESS, with no oikb port published.
  openwebui-internal:
    name: openwebui-internal
    driver: bridge

secrets:
  open_webui_rag_sync_api_key:
    file: ${OPEN_WEBUI_RAG_SYNC_API_KEY_FILE:?set a BWS/Portainer-managed secret file path}
  oikb_api_key:
    file: ${OIKB_API_KEY_FILE:?set a BWS/Portainer-managed secret file path}

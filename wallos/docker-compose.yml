services:
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    ports:
      - "${WALLOS_PORT:-8282}:80/tcp"
    environment:
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ${WALLOS_DATA_DIR:-/opt/stacks/wallos}/db:/var/www/html/db
      - ${WALLOS_DATA_DIR:-/opt/stacks/wallos}/logos:/var/www/html/images/uploads/logos
    restart: unless-stopped
